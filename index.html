<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15100c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>술로그</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=11122120">
</head>
<body>
  <!-- 로그인·가입·승인 대기 화면 -->
  <div id="gate" class="gate"><div class="gbox"><div class="glogo">🥃</div><p class="gsub">불러오는 중…</p></div></div>

  <div id="app" class="hide">
    <header>
      <div class="top">
        <h1>술로그</h1>
        <button id="bell" class="btn small hide">🔔 <span id="bellN"></span></button>
      </div>
    </header>
    <div id="status"></div>

    <main id="v-feed">
      <div class="chips scroll" id="feedbar">
        <button class="chip on" data-f="all">전체</button>
        <button class="chip" data-f="follow">👥 팔로잉</button>
        <button class="chip" data-f="reco">👍 추천만</button>
        <button class="chip" id="findpeople">🔎 사람 찾기</button>
        <button class="chip" id="qrchip">📱 QR</button>
        <button class="chip" id="refresh">↻ 새로고침</button>
      </div>
      <div id="feedlist"></div>
    </main>

    <main id="v-mine" class="hide">
      <div class="stats">
        <div class="stat"><b id="s-total">–</b><span>기록</span></div>
        <div class="stat"><b id="s-places">–</b><span>다녀온 곳</span></div>
        <div class="stat"><b id="s-month">–</b><span>이번 달 지출</span></div>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="이름, 생산자, 장소, 향 검색" autocomplete="off">
        <button id="qclear" class="hide" aria-label="지우기">✕</button>
      </div>
      <div class="chips scroll" id="catfilter"></div>
      <div id="list"></div>
    </main>

    <main id="v-places" class="hide">
      
      <div id="places"></div>
    </main>

    <main id="v-me" class="hide"><div id="me"></div></main>

    <nav><div class="in">
      <button class="tab on" data-v="feed"><span class="ic">🏠</span>피드</button>
      <button class="tab" data-v="mine"><span class="ic">🥃</span>기록</button>
      <button class="fab" id="fab" aria-label="새 기록">+</button>
      <button class="tab" data-v="places"><span class="ic">📍</span>장소</button>
      <button class="tab" data-v="me"><span class="ic">👤</span>나<i id="meDot" class="dotbadge hide"></i></button>
    </div></nav>
  </div>

  <section class="sheet" id="sheet"></section>

  <div class="modal" id="modal"><div class="box">
    <p id="m-msg"></p>
    <div class="row"><button class="btn" id="m-no">취소</button><button class="btn pri" id="m-yes">확인</button></div>
  </div></div>
  <div id="toast"></div>
  <input type="file" id="file" accept="image/*" multiple class="hide">
  <script src="firebase-config.js"></script>
  <script src="categories.js?v=11122120"></script>
  <script type="module" src="app.js?v=11122120"></script>
</body>
</html>
